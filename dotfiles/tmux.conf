# Minimal light-themed .tmux.conf for Unixporn

# Set prefix key to Ctrl-a instead of Ctrl-b
set-option -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# Enable 256 color support
set-option -g default-terminal "screen-256color"

# Status bar - light theme
set-option -g status-style bg=white,fg=black
set-option -g status-left-style bg=white,fg=blue
set-option -g status-right-style bg=white,fg=blue
set-option -g pane-border-style bg=white,fg=black
set-option -g pane-active-border-style bg=white,fg=blue

# Status bar content
set-option -g status-left '#[fg=green]#H#[default]'
set-option -g status-right '#[fg=blue]%Y-%m-%d %H:%M#[default]'

# Window title
set-window-option -g window-status-current-style bg=blue,fg=white
set-window-option -g window-status-style bg=white,fg=black

# Activity monitoring
set-option -g monitor-activity off
set-option -g visual-activity off

# Mouse support
set-option -g mouse on

# Better window splitting
bind-key v split-window -h
bind-key s split-window -v

# Easy exit
bind-key x kill-pane