# -- Modern & Productive TMUX Config --

# General Settings
set -g status-interval 60
set -g status-justify left
set -g status-style bg="#181825",fg="#cdd6f4"
set -g base-index 1
setw -g pane-base-index 1

# Pane Borders
set -g pane-border-style fg="#313244"
set -g pane-active-border-style fg="#89b4fa"

# Message Style
set -g message-style bg="#313244",fg="#fab387",bold

# Left Side: Session Name
set -g status-left-length 50
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] 󰆍 #S #[bg=#181825,fg=#89b4fa] "

# Right Side: Battery, Date, Time
set -g status-right-length 150
set -g status-right "#[fg=#45475a]#[bg=#45475a,fg=#89b4fa] 󰃭 %m/%d #[fg=#585b70]#[bg=#585b70,fg=#a6e3a1,bold] 󰅐 %H:%M "

# Window Status
setw -g window-status-format "#[fg=#585b70] #I:#W "
setw -g window-status-current-format "#[fg=#fab387,bold] #I:#W* "

# Productivity: Mouse support & easy reload
set -g mouse on
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"
