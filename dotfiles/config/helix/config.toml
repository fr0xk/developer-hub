theme = "solarized_light"

[editor]
line-number = "relative" # Hybrid line numbers for efficient jumping
cursorline = true        # Subtle hint of where your cursor is
color-modes = true       # Changes cursor color based on mode (Visual/Insert)
true-color = true        # Required for modern terminal colors

[editor.cursor-shape]
insert = "bar"           # Thin bar for insert mode
normal = "block"         # Solid block for normal mode
select = "underline"     # Underline for selection

[editor.indent-guides]
render = true
character = "╎"          # Minimalist thin dashed line
skip-levels = 1          # Don't draw the first level to save space

[editor.statusline]
left = ["mode", "spacer", "spinner", "file-name"]
center = []
right = ["diagnostics", "position", "file-encoding"]
separator = "│"
mode.normal = "NOR"      # Shortened mode names for minimalism
mode.insert = "INS"
mode.select = "SEL"
