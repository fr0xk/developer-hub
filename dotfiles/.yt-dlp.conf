# yt-dlp configuration for maximum compatibility and clean filenames

# Format selection: prefer mp4, mp3, or m4a
-f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best[ext=mp3]/best"

# Remove junk from filenames (remove special characters, keep only alphanumeric, spaces, hyphens, underscores)
-o "%(title)s.%(ext)s"
--restrict-filenames
--trim-filename 255

# Additional useful options for Android/Termux
--no-check-certificate
--extract-audio
--audio-format best
--audio-quality 0
--embed-thumbnail
--add-metadata
--embed-subs
--convert-subs srt
--xattrs