name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify repository structure
      run: |
        echo "Repository structure verified"
        ls -la
        find . -type d -empty | grep -v ".git" || echo "No empty directories found"